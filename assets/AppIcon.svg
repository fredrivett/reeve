<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    reeve's app icon: a reeve's crook with a lit lantern, on Apple's 824 pt
    icon grid. Source for assets/AppIcon.icns; after editing, regenerate it on a Mac
    (rsvg-convert comes from `brew install librsvg`):

      mkdir AppIcon.iconset
      for s in 16 32 128 256 512; do
        rsvg-convert -w $s assets/AppIcon.svg -o AppIcon.iconset/icon_${s}x${s}.png
        rsvg-convert -w $((s*2)) assets/AppIcon.svg -o AppIcon.iconset/icon_${s}x${s}@2x.png
      done
      iconutil -c icns AppIcon.iconset -o assets/AppIcon.icns
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2125"/>
      <stop offset="1" stop-color="#131417"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".1"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="crook" gradientUnits="userSpaceOnUse" x1="0" y1="3" x2="0" y2="22">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#d3d8e0"/>
    </linearGradient>
    <linearGradient id="lamp" gradientUnits="userSpaceOnUse" x1="0" y1="14.5" x2="0" y2="18.8">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="1" stop-color="#ffc85e"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="17" cy="16.6" r="6.5">
      <stop offset="0" stop-color="#ffcf70" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffcf70" stop-opacity="0"/>
    </radialGradient>
    <filter id="plateShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <filter id="crookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy=".7" stdDeviation=".7" flood-color="#0f172a" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- Shadow on its own shape: filtering the plate itself bands its dark gradient. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000" filter="url(#plateShadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <!-- The glyph on the menu bar icon's 24 pt grid (MenuBarIcon.swift). -->
  <g transform="translate(242 225) scale(22.5)">
    <circle cx="17" cy="16.6" r="6.5" fill="url(#glow)"/>
    <g filter="url(#crookShadow)" fill="none" stroke="url(#crook)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 21V9a4.5 4.5 0 0 1 9 0v.6M5.5 21h5M15 13.5h4"/>
      <path d="M17 9.6v3.3" stroke-width="1.1"/>
      <path d="M15.3 14.5h3.4v2.6a1.7 1.7 0 0 1-3.4 0z" fill="url(#lamp)" stroke="none"/>
    </g>
  </g>

  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2"/>
</svg>
